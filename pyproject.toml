[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-asset-production"
version = "0.1.0.dev0"
description = "IP character asset production Skill core (WorkBuddy / DeepSeek Harness): catalogs, schemas, prompt data and provider contracts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.6,<3",
    "jsonschema>=4.18,<5",
    "pillow>=10,<14",
    "fonttools>=4.40,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema",
]

[project.scripts]
ipap-validate = "ip_asset_production.validation.cli:main"
ipap-secret-scan = "ip_asset_production.security.secret_scan:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Chinese full-width punctuation in strings/comments is intentional

[tool.ruff.lint.per-file-ignores]
"scripts/build_site.py" = ["E501"]  # case captions and inline CSS

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
