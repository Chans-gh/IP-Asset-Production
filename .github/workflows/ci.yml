name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no image-provider credentials, no network services)
        run: python -m pip install -e ".[dev]"
      - name: Privacy / secret scan
        run: python scripts/secret_scan.py
      - name: SPEC static consistency
        run: python scripts/validate_spec.py
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Offline tests (MockProvider only)
        run: pytest

  # v1 release gate: must fail until 48 real, reviewed style previews exist (M2A). Never bypass.
  style-release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pillow
      - run: python scripts/check_style_release.py
