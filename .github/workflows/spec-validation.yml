name: Validate SPEC starter
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate schema files, catalogs and prompt coverage
        run: python scripts/validate_spec.py
